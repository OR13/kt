name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # Build the evidence page on every pull request too, so a broken generator
      # or a report that would publish a disagreement fails here rather than on
      # main. Deployment happens only from main, in pages.yml.
      - name: Build the interop evidence page
        run: |
          cargo run -p kt-interop --bin kt-interop-report -- \
            --vectors interop/vectors \
            --out site \
            --commit "${{ github.sha }}" \
            --rustc "$(rustc --version)"
      - uses: actions/upload-artifact@v4
        with:
          name: interop-evidence-page
          path: site
          if-no-files-found: error

  coverage:
    # A floor on the protocol crates, not the whole workspace: the two binaries in
    # interop/report are CLI entry points that CI exercises by running them, not by
    # unit-testing their argument parsing, and averaging them in would let real
    # coverage in kt-wire/kt-crypto/kt-tree slide while the number stayed put.
    #
    # The floor is deliberately a few points below where the crates sit, so it
    # catches a regression rather than punishing a refactor.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Line coverage of the protocol crates
        run: |
          cargo llvm-cov --summary-only \
            --package kt-wire --package kt-crypto --package kt-tree \
            --fail-under-lines 97

  interop-vectors:
    # Regenerate the committed vectors from the pinned Go peer. A diff means
    # either an upstream bump changed behavior or someone hand-edited a vector —
    # both should fail loudly rather than drift.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: interop/go/go.sum
      - name: Go peer's own test suite
        run: go test ./tree/... ./crypto/...
        working-directory: upstream/katie
      - run: go vet ./...
        working-directory: interop/go
      - name: Regenerate vectors
        run: go run ./cmd/gen -out ../vectors
        working-directory: interop/go

      # The other direction: proofs built by the Rust side, checked by katie's
      # verifiers. This is what catches over-acceptance — a proof we accept and
      # the peer rejects — which comparing recomputed values cannot see.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Emit kt-generated proofs
        run: cargo run -p kt-interop --bin kt-interop-emit -- --out interop/vectors/from-kt.json
      - name: The Go peer must agree about every one of them
        run: go run ./cmd/verify -in ../vectors/from-kt.json
        working-directory: interop/go

      - name: Vectors must be reproducible
        run: git diff --exit-code -- interop/vectors
